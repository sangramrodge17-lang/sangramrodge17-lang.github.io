name: Build Windows Tally Connector

on:
  workflow_dispatch:
  push:
    paths:
      - 'connector/native/**'
      - '.github/workflows/build-tally-connector.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file connector
        run: dotnet publish connector/native/UniversalTallyConnector.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o connector-release
      - name: Upload connector artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTallyConnector-win-x64-v2.16.3
          path: connector-release/UniversalTallyConnector.exe
      - name: Publish connector release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete connector-v2.16.3 --yes --cleanup-tag || true
          gh release create connector-v2.16.3 connector-release/UniversalTallyConnector.exe --title "Connector v2.16.3" --notes "Stable sync path using the proven core Tally XML request; optional enrichment and raw-object capture are disabled by default to prevent Tally port exhaustion, with bounded date windows and live progress." --target ${{ github.sha }}
